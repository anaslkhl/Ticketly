        <section class="myform" style="display: none;">
            <div class="ticketdiv">
                <div class="ticket">
                    <div class="leftside">
                        <p>enjoy us</p>
                        <img id="qrcode" src="/img/qr.webp" alt="">
                    </div>
                    <div class="rightside">
                        <div id="pp1">
                            <p id="p1"></p>
                        </div>
                        <div class="cida">
                            <p id="city"></p>
                            <p id="date"></p>
                        </div>
                        <div>
                            <div class="pric">
                                <p id="price"></p>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="addsub">
                    <button id="btn1">-</button>
                    <div id="numofticket"></div>
                    <button id="btn11">+</button>
                </div>
                <div class="divbtn">
                    <button id="prev" class="btn2">previous</button>
                    <button id="next" class="btn2">next</button>
                </div>
            </div>

        </section>
        <section class="form-container" style="display: none;">
            <h2 class="counter">Participant <span id="numofpart">1</span> </h2>

            <form id="myform">
                <div class="form-group">
                    <label for="firstName">Prénom</label>
                    <input type="text" id="prenom" name="firstName" placeholder="Entrez le prénom" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Nom</label>
                    <input type="text" id="nom" name="lastName" placeholder="Entrez le nom" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Entrez l’email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Téléphone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Entrez le téléphone" pattern="[0-9]{10}"
                        required>
                </div>
                <input type="submit" id="send" value="send ">
                <!-- <button id="validerbtn" class="bbtn" type="submit">Valider ce participant</button> -->
            </form>

            <div class="summary">
                <h3>Participants enregistrés</h3>

            </div>

            <button class="bbtn" id="nextStep">Étape suivante</button>
        </section>
        <section class="confirmation-box" style="display: none;">
            <h2>Récapitulatif de la réservation</h2>

            <div class="section0" id="selectedevent">


            </div>

            <div class="section0" id="numberof">
                <p id="slecttickets"><strong></strong></p>
            </div>

            <div class="section0" id="deta">
                <h3>👥 Détails des participants</h3>

            </div>

            <div class="section total">
                <h3>💰 Total à payer</h3>
                <p><strong>150,00 €</strong></p>
            </div>

            <button class="bbtn" onclick="alert('Réservation confirmée 🎉')">Confirmer la réservation</button>
        </section>
